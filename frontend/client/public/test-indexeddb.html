<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndexedDB Test - AI Lesson Planning</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1890ff;
            border-bottom: 2px solid #1890ff;
            padding-bottom: 10px;
        }
        h2 {
            color: #333;
            margin-top: 30px;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            background: #f9f9f9;
            border-left: 4px solid #1890ff;
        }
        .result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            color: #52c41a;
        }
        .error {
            background: #fff2f0;
            border: 1px solid #ffccc7;
            color: #ff4d4f;
        }
        .info {
            background: #e6f7ff;
            border: 1px solid #91d5ff;
            color: #1890ff;
        }
        button {
            background: #1890ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
            font-size: 14px;
        }
        button:hover {
            background: #40a9ff;
        }
        button:disabled {
            background: #d9d9d9;
            cursor: not-allowed;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 32px;
            font-weight: bold;
        }
        .stat-label {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗄️ IndexedDB Test Suite</h1>
        <p>This page tests the IndexedDB offline storage functionality for the AI Lesson Planning system.</p>

        <div id="results"></div>

        <h2>Quick Tests</h2>
        <div>
            <button onclick="runAllTests()">Run All Tests</button>
            <button onclick="testBasicOperations()">Test Basic CRUD</button>
            <button onclick="testStorageQuota()">Test Storage Quota</button>
            <button onclick="viewStorageStats()">View Storage Stats</button>
            <button onclick="clearAllData()">Clear All Data</button>
        </div>

        <div id="storage-stats" class="stats"></div>
        <div id="test-output"></div>
    </div>

    <script>
        const DB_NAME = 'ai-lesson-planning-offline';
        const DB_VERSION = 1;

        let testResults = [];

        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.textContent = message;

            const output = document.getElementById('test-output');
            output.insertBefore(div, output.firstChild);

            testResults.push({ message, type, timestamp: new Date() });
        }

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);

                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);

                request.onupgradeneeded = (event) => {
                    const db = event.target.result;

                    if (!db.objectStoreNames.contains('lessons')) {
                        const store = db.createObjectStore('lessons', { keyPath: '_id' });
                        store.createIndex('grade', 'grade', { unique: false });
                    }

                    if (!db.objectStoreNames.contains('assessments')) {
                        const store = db.createObjectStore('assessments', { keyPath: '_id' });
                        store.createIndex('assessmentType', 'assessmentType', { unique: false });
                    }

                    if (!db.objectStoreNames.contains('classes')) {
                        const store = db.createObjectStore('classes', { keyPath: '_id' });
                        store.createIndex('grade', 'grade', { unique: false });
                    }
                };
            });
        }

        async function testBasicOperations() {
            log('Starting Basic CRUD Operations Test...', 'info');

            try {
                const db = await openDB();

                // Test 1: Add item
                const testLesson = {
                    _id: 'test-lesson-1',
                    specificTopic: 'Test Lesson',
                    grade: 'Form 1',
                    learningObjective: 'Test objective',
                    downloadedAt: new Date().toISOString()
                };

                const addRequest = db.transaction(['lessons'], 'readwrite')
                    .objectStore('lessons')
                    .add(testLesson);

                await new Promise((resolve, reject) => {
                    addRequest.onsuccess = resolve;
                    addRequest.onerror = reject;
                });

                log('✓ Successfully added test lesson', 'success');

                // Test 2: Get item
                const getRequest = db.transaction(['lessons'], 'readonly')
                    .objectStore('lessons')
                    .get('test-lesson-1');

                const result = await new Promise((resolve, reject) => {
                    getRequest.onsuccess = () => resolve(getRequest.result);
                    getRequest.onerror = reject;
                });

                if (result && result._id === 'test-lesson-1') {
                    log('✓ Successfully retrieved test lesson', 'success');
                } else {
                    log('✗ Failed to retrieve test lesson', 'error');
                }

                // Test 3: Update item
                result.specificTopic = 'Updated Test Lesson';
                const updateRequest = db.transaction(['lessons'], 'readwrite')
                    .objectStore('lessons')
                    .put(result);

                await new Promise((resolve, reject) => {
                    updateRequest.onsuccess = resolve;
                    updateRequest.onerror = reject;
                });

                log('✓ Successfully updated test lesson', 'success');

                // Test 4: Delete item
                const deleteRequest = db.transaction(['lessons'], 'readwrite')
                    .objectStore('lessons')
                    .delete('test-lesson-1');

                await new Promise((resolve, reject) => {
                    deleteRequest.onsuccess = resolve;
                    deleteRequest.onerror = reject;
                });

                log('✓ Successfully deleted test lesson', 'success');
                log('All basic CRUD operations completed successfully!', 'success');

                db.close();
            } catch (error) {
                log(`✗ Error during basic operations: ${error.message}`, 'error');
            }
        }

        async function testStorageQuota() {
            log('Testing Storage Quota API...', 'info');

            if ('storage' in navigator && 'estimate' in navigator.storage) {
                try {
                    const estimate = await navigator.storage.estimate();
                    const usageMB = (estimate.usage / (1024 * 1024)).toFixed(2);
                    const quotaMB = (estimate.quota / (1024 * 1024)).toFixed(2);
                    const percentage = ((estimate.usage / estimate.quota) * 100).toFixed(2);

                    log(`✓ Storage Quota API available`, 'success');
                    log(`Usage: ${usageMB} MB / ${quotaMB} MB (${percentage}%)`, 'info');

                    updateStorageStats(estimate);
                } catch (error) {
                    log(`✗ Error getting storage estimate: ${error.message}`, 'error');
                }
            } else {
                log('✗ Storage Quota API not supported', 'error');
            }
        }

        function updateStorageStats(estimate) {
            const statsDiv = document.getElementById('storage-stats');
            const usageMB = (estimate.usage / (1024 * 1024)).toFixed(2);
            const quotaMB = (estimate.quota / (1024 * 1024)).toFixed(2);
            const availableMB = ((estimate.quota - estimate.usage) / (1024 * 1024)).toFixed(2);
            const percentage = ((estimate.usage / estimate.quota) * 100).toFixed(1);

            statsDiv.innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${usageMB}</div>
                    <div class="stat-label">MB Used</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${quotaMB}</div>
                    <div class="stat-label">MB Total</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${availableMB}</div>
                    <div class="stat-label">MB Available</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${percentage}%</div>
                    <div class="stat-label">Usage</div>
                </div>
            `;
        }

        async function viewStorageStats() {
            log('Loading storage statistics...', 'info');

            try {
                const db = await openDB();
                const stores = ['lessons', 'assessments', 'classes'];
                const stats = {};

                for (const storeName of stores) {
                    const count = await new Promise((resolve, reject) => {
                        const request = db.transaction([storeName], 'readonly')
                            .objectStore(storeName)
                            .count();
                        request.onsuccess = () => resolve(request.result);
                        request.onerror = reject;
                    });
                    stats[storeName] = count;
                }

                log(`Lessons: ${stats.lessons}`, 'info');
                log(`Assessments: ${stats.assessments}`, 'info');
                log(`Classes: ${stats.classes}`, 'info');

                db.close();
            } catch (error) {
                log(`✗ Error getting stats: ${error.message}`, 'error');
            }
        }

        async function clearAllData() {
            if (!confirm('Are you sure you want to clear all offline data?')) {
                return;
            }

            log('Clearing all offline data...', 'info');

            try {
                await new Promise((resolve, reject) => {
                    const request = indexedDB.deleteDatabase(DB_NAME);
                    request.onsuccess = resolve;
                    request.onerror = reject;
                });

                log('✓ All offline data cleared successfully', 'success');
                document.getElementById('storage-stats').innerHTML = '';
            } catch (error) {
                log(`✗ Error clearing data: ${error.message}`, 'error');
            }
        }

        async function runAllTests() {
            log('====================================', 'info');
            log('Running All Tests...', 'info');
            log('====================================', 'info');

            await testBasicOperations();
            await testStorageQuota();
            await viewStorageStats();

            log('====================================', 'info');
            log('All tests completed!', 'success');
            log('====================================', 'info');
        }

        // Run initial storage quota check
        window.addEventListener('load', () => {
            log('IndexedDB Test Suite Loaded', 'success');
            testStorageQuota();
        });
    </script>
</body>
</html>
